name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  Build-Release-Artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows binary
        run: |
          dotnet publish ./src/qb-port-updater.csproj \
            -c Release \
            -r win-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o ./artifact/publish

      - name: Prepare release package
        run: |
          cp install_service.ps1 uninstall_service.ps1 README.md ./artifact/publish/

      - name: Zip package for release
        id: zip_artifact
        run: |
          APP_NAME="qb-port-updater"
          VERSION="${{ github.ref_name }}"
          VERSION_CLEANED="${VERSION#v}"
          ARTIFACT_FILENAME="${APP_NAME}-${VERSION_CLEANED}.zip"

          (cd artifact/publish && zip -r "../../${ARTIFACT_FILENAME}" .)

          echo "artifact_path=${{ github.workspace }}/${ARTIFACT_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.zip_artifact.outputs.artifact_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
