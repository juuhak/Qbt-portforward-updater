name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows binary
        run: |
          dotnet publish ./src/qb-port-updater.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o ./artifact/publish

      - name: Copy installer and helper scripts
        run: |
          mkdir artifact\package
          copy install_service.ps1 artifact\package\ 2>$null || echo
          copy uninstall_service.ps1 artifact\package\ 2>$null || echo
          copy start_with_env.ps1 artifact\package\ 2>$null || echo
          # Package example config (do NOT include real appsettings.json containing secrets)
          copy appsettings.json.example artifact\package\ 2>$null || echo
          # Include nlog.config if present in src so the published package has logging configured
          copy src\nlog.config artifact\package\ 2>$null || echo
          copy README.md artifact\ 2>$null || echo

      - name: Zip package
        run: |
          powershell -Command "Compress-Archive -Path artifact\publish\* , artifact\package\* -DestinationPath artifact.zip -Force"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb-port-updater-artifact
          path: artifact.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifact.zip
