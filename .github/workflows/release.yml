name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  Build-Release-Artifact:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained Windows binary
        shell: pwsh
        run: |
          dotnet publish ./src/qb-port-updater.csproj `
            -c Release `
            -r win-x64 `
            -o ./artifact/win-x64

      - name: Prepare release package
        shell: pwsh
        run: |
          Remove-Item ./artifact/win-x64/*.pdb -Force -ErrorAction SilentlyContinue
          Copy-Item install_service.ps1, uninstall_service.ps1, README.md -Destination ./artifact/win-x64/

      - name: Zip package for release
        id: zip_artifact
        shell: pwsh
        run: |
          $APP_NAME = "qb-port-updater"
          $VERSION = "${{ github.ref_name }}"
          $VERSION_CLEANED = $VERSION -replace '^v', ''
          $ARTIFACT_FILENAME = "$APP_NAME-$VERSION_CLEANED.zip"

          Compress-Archive -Path ./artifact/win-x64/* -DestinationPath "./$ARTIFACT_FILENAME"

          $ARTIFACT_PATH = Join-Path "${{ github.workspace }}" $ARTIFACT_FILENAME
          echo "artifact_path=$ARTIFACT_PATH" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.zip_artifact.outputs.artifact_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
