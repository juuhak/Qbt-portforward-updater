name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows binary
        run: |
          dotnet publish ./src/qb-port-updater.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o ./artifact/publish

      - name: Prepare release package
        run: |
          # Create a directory for helper scripts and documentation
          mkdir -p artifact/package
          
          # Copy scripts and README into the package directory
          cp install_service.ps1 artifact/package/
          cp uninstall_service.ps1 artifact/package/
          cp README.md artifact/package/

      - name: Zip package for release
        id: zip_artifact
        run: |
          APP_NAME="qb-port-updater"
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix if it exists, e.g., v1.0.0 -> 1.0.0
          VERSION_CLEANED="${VERSION#v}"
          ARTIFACT_FILENAME="${APP_NAME}-${VERSION_CLEANED}.zip"
          
          # Create the zip file in the root of the workspace
          (cd artifact && zip -r "../${ARTIFACT_FILENAME}" .)
          
          # Set output variable for the artifact path, relative to the workspace root
          echo "artifact_path=${{ github.workspace }}/${ARTIFACT_FILENAME}" >> "$GITHUB_OUTPUT"
          
      - name: Upload Artifact to GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: "${{ steps.zip_artifact.outputs.artifact_path }}"
